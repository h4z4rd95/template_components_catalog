name: dokploy-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dokploy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Dokploy compose deploy
        env:
          COMPOSE_ID: 9zOqQQInQF4oI6ywZgmgb
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/resp.json -w "%{{http_code}}" -X POST \
              "https://dokploy.ppsj.ir/api/compose.deploy" \
              -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"composeId\":\"$COMPOSE_ID\"}")
            if [ "$code" = "200" ]; then
              echo "Dokploy compose deploy triggered for $COMPOSE_ID"
              exit 0
            fi
            echo "attempt $i: HTTP $code -> $(cat /tmp/resp.json)"
            sleep 30
          done
          echo "Dokploy deploy trigger failed after 3 attempts"
          exit 1
